<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Painel - Mini CRM</title>

</head>

    <a href="index.html" class="w3-display-topleft">
        <i class="fa fa-arrow-circle-left w3-large w3-blue w3-button w3-xxlarge"></i>     
    </a>

<body class="w3-light-grey">

    <div class="w3-padding w3-text-grey w3-half w3-display-middle w3-center" style="width: 90%; max-width: 950px;">
        <!-- Cabeçalho -->
        <h1 class="w3-center w3-blue w3-round-large w3-margin w3-padding" style="font-weight: bold;">
            🚀 CRM Marketing Hub
        </h1>
        
        <!-- Grid de Botões Alinhados por Flexbox -->
        <div class="w3-row-padding w3-margin-top" style="display: flex; flex-wrap: wrap; align-items: stretch;">
            
            <!-- Botão 1: Cadastrar Cliente -->
            <div class="w3-quarter w3-margin-bottom" style="display: flex;">
                <a href="cadastrar_cliente.html" class="w3-button w3-blue w3-round-large w3-block" style="text-decoration: none; padding: 25px 0; white-space: normal; height: 100%; display: flex; flex-direction: column; justify-content: center;"> 
                    <i class="fa fa-user-plus" style="font-size: 4.5em"></i>
                    <p style="font-size: 1.4em; margin: 15px 0 0 0; line-height: 1.2; font-weight: bold;">Novo Cliente</p>
                </a>
            </div>

            <!-- Botão 2: Listar Clientes -->
            <div class="w3-quarter w3-margin-bottom" style="display: flex;">
                <a href="listar_clientes.html" class="w3-button w3-blue w3-round-large w3-block" style="text-decoration: none; padding: 25px 0; white-space: normal; height: 100%; display: flex; flex-direction: column; justify-content: center;"> 
                    <i class="fa fa-users" style="font-size: 4.5em"></i>
                    <p style="font-size: 1.4em; margin: 15px 0 0 0; line-height: 1.2; font-weight: bold;">Ver Clientes</p>
                </a>
            </div>

            <!-- Botão 3: Cadastrar Campanha -->
            <div class="w3-quarter w3-margin-bottom" style="display: flex;">
                <a href="cadastrar_campanha.html" class="w3-button w3-teal w3-round-large w3-block" style="text-decoration: none; padding: 25px 0; white-space: normal; height: 100%; display: flex; flex-direction: column; justify-content: center;"> 
                    <i class="fa fa-bullhorn" style="font-size: 4.5em"></i>
                    <p style="font-size: 1.4em; margin: 15px 0 0 0; line-height: 1.2; font-weight: bold;">Nova Campanha</p>
                </a>
            </div>

            <!-- Botão 4: Listar Campanhas -->
            <div class="w3-quarter w3-margin-bottom" style="display: flex;">
                <a href="listar_campanhas.html" class="w3-button w3-teal w3-round-large w3-block" style="text-decoration: none; padding: 25px 0; white-space: normal; height: 100%; display: flex; flex-direction: column; justify-content: center;"> 
                    <i class="fa fa-envelope-open" style="font-size: 4.5em"></i>
                    <p style="font-size: 1.4em; margin: 15px 0 0 0; line-height: 1.2; font-weight: bold;">Ver Campanhas</p>
                </a>
            </div>

        </div>
    </div>

</body>
</html>
