<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Criar Campanha</title>

</head>

<body class="w3-light-grey">

<div class="w3-container w3-card-4 w3-white w3-margin w3-round-large w3-display-middle" style="width: 90%; max-width: 500px;">
    <h2 class="w3-text-teal w3-center" style="font-weight: bold; margin-top: 20px;">📢 Nova Campanha</h2>
    <p class="w3-center w3-text-grey">Planeje o próximo disparo ou publicação da marca.</p>

    <form class="w3-container w3-padding-16" onsubmit="alert('Campanha salva com sucesso! (Simulação Front-End)');">
        <label style="font-weight: bold;">Nome da Ação</label>
        <input class="w3-input w3-border w3-round w3-margin-bottom" type="text" placeholder="Ex: Promoção Dia das Mães" required>

        <label style="font-weight: bold;">Canal de Envio</label>
        <select class="w3-select w3-border w3-round w3-margin-bottom">
            <option value="WhatsApp">Disparo de Lista no WhatsApp</option>
            <option value="E-mail">E-mail Marketing (Newsletter)</option>
            <option value="Rede Social">Post Patrocinado (Meta Ads / Instagram)</option>
        </select>

        <label style="font-weight: bold;">Data de Lançamento</label>
        <input class="w3-input w3-border w3-round w3-margin-bottom" type="date" required>

        <label style="font-weight: bold;">Texto / Descrição da Oferta</label>
        <textarea class="w3-input w3-border w3-round w3-margin-bottom" rows="3" placeholder="Digite aqui o texto que será enviado para os clientes..."></textarea>

        <button type="submit" class="w3-button w3-block w3-teal w3-round w3-margin-top w3-padding-large">Agendar Campanha</button>
        <a href="principal.html" class="w3-button w3-block w3-light-grey w3-round w3-margin-top w3-center">Voltar ao Painel</a>
    </form>
</div>

</body>
</html>
