<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Login - Mini CRM</title>

</head>

<body class="w3-light-grey">

    <div class="w3-container w3-round-xxlarge w3-display-middle w3-card-4 w3-white" style="width: 90%; max-width: 400px; padding: 24px;">

        <div class="w3-center">
            <h2 class="w3-text-blue" style="font-weight: bold; margin-bottom: 0;">Área de Login</h2>
            <p class="w3-text-grey" style="margin-top: 5px;">Mini-CRM de Vendas</p>
            
            <i class="fa fa-user-circle w3-text-blue w3-margin-top" style="font-size: 5.5em;"></i>
        </div>

        <form class="w3-container w3-margin-top" action="principal.html" method="get">
            <div class="w3-section">
                
                <label style="font-weight: bold;" class="w3-text-grey">Usuário</label>
                <input class="w3-input w3-border w3-round-large w3-margin-bottom" type="text" placeholder="Digite seu usuário" required>

                <label style="font-weight: bold;" class="w3-text-grey">Senha</label>
                <input class="w3-input w3-border w3-round-large" type="password" placeholder="Digite sua senha" required>

                <button class="w3-button w3-block w3-blue w3-round-large w3-section w3-padding-large" type="submit" style="font-weight: bold;">
                    Entrar <i class="fa fa-sign-in"></i>
                </button>

            </div>
        </form>
    
    </div>

</body>
</html>
