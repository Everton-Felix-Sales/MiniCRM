services:
  mysql:
    image: mysql:8
    container_name: lab_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mini_CRM
      MYSQL_USER: user
      MYSQL_PASSWORD: "123456"
      TZ: America/Sao_Paulo
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lab_agente

  waha:
    image: devlikeapro/waha:noweb
    container_name: lab_waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: America/Sao_Paulo
      WAHA_SESSION_NAME: default
      WAHA_LOG_LEVEL: info
      WAHA_PRINT_QR: "true"
      WAHA_AUTH_ENABLED: "true"
      WAHA_AUTH_USERNAME: admin
      WAHA_AUTH_PASSWORD: "123456"
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_NOWEB_WA_VERSION: auto-web
      WA_EXTRACT_NUMBER: "true"
      WA_USE_JID_NUMBER: "true"
      WA_RESOLVE_LID: "true"
      WAHA_AUTO_RESTART: "true"
      WAHA_API_KEY: "123456789"
    volumes:
      - waha_data:/app/data
    networks:
      - lab_agente

volumes:
  mysql_data:
  waha_data:

networks:
  lab_agente:
    driver: bridge
